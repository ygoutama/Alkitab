<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alkitab Parallel Modern (Hesed & Emet Style)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* SBL Hebrew bukan font Google, jadi dikeluarkan dari URL (kalau ada, seluruh import gagal) */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Noto+Serif+Hebrew:wght@400;600&family=Gentium+Plus:ital@0;1&display=swap');

        body { font-family: 'Inter', sans-serif; }
        .font-serif-bible { font-family: 'Merriweather', serif; }
        .font-hebrew { font-family: 'SBL Hebrew', 'Noto Serif Hebrew', serif; direction: rtl; }
        .font-greek { font-family: 'Gentium Plus', serif; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 3px; }

        .theme-light { background-color: #f8fafc; color: #1e293b; }
        .theme-sepia { background-color: #fbf0d9; color: #433422; }
        .theme-dark { background-color: #0f172a; color: #e2e8f0; }

        .card-bg { background-color: #ffffff; }
        .theme-sepia .card-bg { background-color: #f4e4c1; border-color: #e2cf9f; }
        .theme-dark .card-bg { background-color: #1e293b; border-color: #334155; }
    </style>
</head>
<body class="theme-light min-h-screen flex flex-col transition-colors duration-200">

    <!-- Header Navigation -->
    <header class="card-bg sticky top-0 z-30 border-b shadow-sm px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <button id="btn-toggle-sidebar" class="p-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/10">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-book-bible text-amber-600 text-xl"></i>
                <h1 class="font-bold text-lg tracking-tight hidden md:block">Alkitab Parallel <span id="badge-label" class="text-xs px-2 py-0.5 rounded bg-amber-500/20 text-amber-700 dark:text-amber-300">Indonesia + English + Teks Asli</span></h1>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <select id="book-select" onchange="onBookChange()" class="p-2 border rounded-lg card-bg text-sm font-semibold focus:outline-none focus:border-amber-500"></select>
            <select id="chapter-select" onchange="onChapterChange()" class="p-2 border rounded-lg card-bg text-sm font-semibold focus:outline-none focus:border-amber-500"></select>
        </div>

        <div class="flex items-center space-x-2">
            <button onclick="promptApiKey()" class="p-2 rounded-lg hover:bg-black/5 text-amber-600" title="Atur Grok API Key">
                <i class="fa-solid fa-key text-lg"></i>
            </button>
            <button onclick="toggleTheme()" class="p-2 rounded-lg hover:bg-black/5" title="Ganti Tema">
                <i class="fa-solid fa-palette text-lg"></i>
            </button>
        </div>
    </header>

    <!-- App Main Layout -->
    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="w-72 border-r card-bg flex flex-col transition-all duration-300 absolute md:relative z-20 h-[calc(100vh-57px)] -translate-x-full md:translate-x-0">
            <div class="p-3 border-b flex items-center space-x-2">
                <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
                <input type="text" id="search-book" oninput="renderSidebarBooks(this.value)" placeholder="Cari Kitab..." class="w-full bg-transparent text-sm focus:outline-none">
            </div>
            <div class="flex border-b text-xs font-semibold">
                <button id="tab-ot" onclick="switchTestament('OT')" class="flex-1 py-2.5 text-center border-b-2 border-amber-600 text-amber-600 font-bold">Perjanjian Lama</button>
                <button id="tab-nt" onclick="switchTestament('NT')" class="flex-1 py-2.5 text-center border-b-2 border-transparent text-gray-500">Perjanjian Baru</button>
            </div>
            <div id="sidebar-book-list" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
        </aside>

        <!-- Main Passage Content -->
        <main id="main-scroll" class="flex-1 flex flex-col overflow-y-auto relative p-4 md:p-6">
            <div class="max-w-5xl w-full mx-auto mb-6 flex items-center justify-between border-b pb-4">
                <button onclick="prevChapter()" class="flex items-center space-x-2 text-sm font-medium hover:text-amber-600">
                    <i class="fa-solid fa-chevron-left"></i>
                    <span>Pasal Sebelumnya</span>
                </button>

                <h2 id="passage-title" class="text-2xl font-bold font-serif-bible text-center">Kejadian 1</h2>

                <button onclick="nextChapter()" class="flex items-center space-x-2 text-sm font-medium hover:text-amber-600">
                    <span>Pasal Berikutnya</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <div id="verses-container" class="max-w-5xl w-full mx-auto space-y-6"></div>

            <!-- Atribusi sumber data (diisi dari bible_db.json -> meta.sources) -->
            <footer id="sources" class="max-w-5xl w-full mx-auto mt-10 pt-4 border-t text-[11px] text-gray-400 text-center"></footer>
        </main>

        <!-- Exegesis / Commentary Drawer (Grok AI): tertutup dulu, melayang di HP, di samping di layar lebar -->
        <aside id="commentary-panel" class="hidden fixed right-0 top-[57px] z-40 w-full sm:w-96 h-[calc(100vh-57px)] border-l card-bg flex-col p-4 overflow-y-auto lg:static lg:z-auto lg:shrink-0">
            <div class="flex items-center justify-between border-b pb-3 mb-4">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-robot text-amber-600"></i>
                    <h3 class="font-bold text-sm">Grok Exegesis Panel</h3>
                </div>
                <button onclick="closeCommentary()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="commentary-content" class="text-xs leading-relaxed space-y-3">
                <p class="text-gray-400 text-center py-12">Pilih ayat dan klik "Tafsiran & Eksegesis" untuk memanggil analisis bahasa asli dari Grok AI.</p>
            </div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
